<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>PantryChef AI</title>

<link
  rel="preconnect"
  href="https://fonts.googleapis.com"
>

<link
  href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Caveat:wght@600;700&family=Work+Sans:wght@400;500;600&display=swap"
  rel="stylesheet"
>

<style>

:root {
  --board: #24312B;
  --board-light: #2E3F37;
  --chalk: #F2EFE6;
  --paper: #FBF7EE;
  --mustard: #E3A72F;
  --teal: #6E9B8C;
  --ink: #24312B;
  --line: rgba(242,239,230,0.16);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--board);
  color: var(--chalk);
  font-family: 'Work Sans', sans-serif;
  min-height: 100vh;
}

.wrap {
  max-width: 880px;
  margin: 0 auto;
  padding: 56px 24px 80px;
}

header {
  text-align: center;
  margin-bottom: 48px;
}

.eyebrow {
  font-family: 'Caveat', cursive;
  font-size: 1.4rem;
  color: var(--mustard);
  margin-bottom: 4px;
}

h1 {
  font-family: 'Fraunces', serif;
  font-weight: 700;
  font-size: clamp(2.4rem, 6vw, 3.6rem);
  margin: 0 0 12px;
  line-height: 1.05;
}

h1 span {
  color: var(--mustard);
  font-style: italic;
}

.sub {
  color: rgba(242,239,230,0.7);
  font-size: 1.05rem;
  max-width: 520px;
  margin: 0 auto;
}

.board {
  background: var(--board-light);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 32px;
  box-shadow: inset 0 0 60px rgba(0,0,0,0.25);
}

label {
  display: block;
  font-family: 'Caveat', cursive;
  font-size: 1.3rem;
  color: var(--mustard);
  margin-bottom: 8px;
}

.tag-input {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  background: var(--board);
  border: 1px dashed var(--line);
  border-radius: 12px;
  padding: 12px;
  min-height: 54px;
  align-items: center;
}

.tag {
  background: var(--mustard);
  color: var(--ink);
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 0.9rem;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 6px;
}

.tag button {
  background: none;
  border: none;
  color: var(--ink);
  cursor: pointer;
  font-size: 1rem;
  line-height: 1;
  opacity: 0.7;
  padding: 0;
}

#ingredientText {
  flex: 1;
  min-width: 160px;
  background: transparent;
  border: none;
  outline: none;
  color: var(--chalk);
  font-size: 1rem;
  font-family: 'Work Sans', sans-serif;
  padding: 6px;
}

#ingredientText::placeholder {
  color: rgba(242,239,230,0.4);
}

.row {
  display: flex;
  gap: 20px;
  margin-top: 24px;
  flex-wrap: wrap;
}

.field {
  flex: 1;
  min-width: 200px;
}

select {
  width: 100%;
  background: var(--board);
  border: 1px solid var(--line);
  color: var(--chalk);
  padding: 12px;
  border-radius: 10px;
  font-family: 'Work Sans', sans-serif;
  font-size: 0.95rem;
}

.cta {
  margin-top: 28px;
  width: 100%;
  background: var(--mustard);
  color: var(--ink);
  border: none;
  padding: 16px;
  border-radius: 12px;
  font-family: 'Fraunces', serif;
  font-weight: 600;
  font-size: 1.15rem;
  cursor: pointer;
}

.cta:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

#output {
  margin-top: 40px;
}

.recipe-card {
  background: var(--paper);
  color: var(--ink);
  border-radius: 16px;
  padding: 32px;
  line-height: 1.65;
  font-size: 1rem;
  overflow-wrap: break-word;
}

.recipe-card h1,
.recipe-card h2,
.recipe-card h3 {
  font-family: 'Fraunces', serif;
  color: var(--ink);
}

.recipe-card h2 {
  border-bottom: 2px solid var(--mustard);
  padding-bottom: 6px;
  margin-top: 28px;
}

.recipe-card strong {
  color: var(--teal);
}

.followup {
  margin-top: 20px;
  display: flex;
  gap: 10px;
}

.followup input {
  flex: 1;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--board);
  color: var(--chalk);
  font-family: 'Work Sans', sans-serif;
}

.cta2 {
  background: var(--teal);
  color: var(--ink);
  border: none;
  padding: 12px 20px;
  border-radius: 10px;
  font-weight: 600;
  cursor: pointer;
}

.empty {
  text-align: center;
  color: rgba(242,239,230,0.5);
  padding: 40px 0;
  font-family: 'Caveat', cursive;
  font-size: 1.3rem;
}

.loading {
  text-align: center;
  padding: 40px;
  font-family: 'Caveat', cursive;
  font-size: 1.5rem;
  color: var(--mustard);
}

.error {
  background: #fff0ed;
  color: #a33;
  border-radius: 12px;
  padding: 20px;
  line-height: 1.6;
}

@media (max-width: 600px) {

  .wrap {
    padding: 32px 16px 60px;
  }

  .board {
    padding: 20px;
  }

  #ingredientText {
    min-width: 120px;
  }

  .followup {
    flex-direction: column;
  }

  .cta2 {
    width: 100%;
  }

  .recipe-card {
    padding: 22px;
  }

}

</style>

</head>

<body>

<div class="wrap">

<header>

<div class="eyebrow">
no grocery run required
</div>

<h1>
What's in your <span>pantry?</span>
</h1>

<p class="sub">
Type what you've got, tell PantryChef about any dietary needs,
and get real recipes you can cook tonight.
</p>

</header>


<div class="board">


<label for="ingredientText">
Ingredients on hand
</label>


<div
  class="tag-input"
  id="tagInput"
>

<input
  id="ingredientText"
  type="text"
  autocomplete="off"
  autocorrect="off"
  autocapitalize="off"
  spellcheck="false"
  enterkeyhint="done"
  placeholder="type an ingredient and hit Enter — e.g. eggs, spinach, rice"
>


</div>


<div class="row">

<div class="field">

<label for="diet">
Dietary preference
</label>

<select
  id="diet"
  tabindex="-1"
>

<option value="none">
No preference
</option>

<option value="vegetarian">
Vegetarian
</option>

<option value="vegan">
Vegan
</option>

<option value="gluten-free">
Gluten-free
</option>

<option value="dairy-free">
Dairy-free
</option>

<option value="low-carb">
Low-carb
</option>

</select>

</div>

</div>


<button
  type="button"
  class="cta"
  id="generateBtn"
>

Find me something to cook

</button>


<div id="output">

<div
  class="empty"
  id="emptyState"
>

Your recipes will show up here, chalk-fresh ✨

</div>

</div>


<div
  class="followup"
  id="followupRow"
  style="display:none;"
>

<input
  id="followupInput"
  type="text"
  placeholder="tweak it — e.g. 'make it spicier' or 'swap the eggs'"
>

<button
  type="button"
  class="cta2"
  id="followupBtn"
>

Ask

</button>

</div>


</div>

</div>


<script>

const tagInput =
document.getElementById("tagInput");

const ingredientText =
document.getElementById("ingredientText");

const generateBtn =
document.getElementById("generateBtn");

const dietSelect =
document.getElementById("diet");

const output =
document.getElementById("output");

const followupRow =
document.getElementById("followupRow");

const followupInput =
document.getElementById("followupInput");

const followupBtn =
document.getElementById("followupBtn");


let tags = [];

let conversationHistory = "";


/* ==============================
   ESCAPE HTML
============================== */

function escapeHtml(text) {

const div =
document.createElement("div");

div.textContent = text;

return div.innerHTML;

}


/* ==============================
   RENDER TAGS
============================== */

function renderTags() {

document
.querySelectorAll(".tag")
.forEach(function(tag) {

tag.remove();

});


tags.forEach(function(tag, index) {

const element =
document.createElement("span");

element.className =
"tag";


element.innerHTML =

escapeHtml(tag) +

` <button
type="button"
data-index="${index}"
>×</button>`;


tagInput.insertBefore(
element,
ingredientText
);

});

}


/* ==============================
   ADD INGREDIENT
============================== */

function addIngredient() {

const value =
ingredientText.value.trim();


if (!value) {

ingredientText.focus();

return;

}


/*
 Prevent duplicate ingredients
*/

const exists =
tags.some(function(item) {

return item.toLowerCase() ===
value.toLowerCase();

});


if (!exists) {

tags.push(value);

}


/*
 Clear input
*/

ingredientText.value = "";


/*
 Render new tag
*/

renderTags();


/*
 IMPORTANT:

Keep focus on the ingredient input.
This prevents mobile browser from
moving to Dietary Preference.
*/

setTimeout(function() {

ingredientText.focus();

}, 50);

}


/* ==============================
   INGREDIENT INPUT
============================== */


/*
 KEYDOWN

Prevent browser default Enter action.
*/

ingredientText.addEventListener(
"keydown",
function(event) {

if (
event.key === "Enter" ||
event.keyCode === 13
) {

event.preventDefault();

event.stopImmediatePropagation();

}

}
);


/*
 KEYPRESS

Prevent browser form navigation.
*/

ingredientText.addEventListener(
"keypress",
function(event) {

if (
event.key === "Enter" ||
event.keyCode === 13
) {

event.preventDefault();

event.stopImmediatePropagation();

}

}
);


/*
 KEYUP

Actually add the ingredient.
*/

ingredientText.addEventListener(
"keyup",
function(event) {

if (
event.key === "Enter" ||
event.keyCode === 13
) {

event.preventDefault();

event.stopImmediatePropagation();

addIngredient();

}

}
);


/* ==============================
   BACKSPACE
============================== */

ingredientText.addEventListener(
"keydown",
function(event) {

if (
event.key === "Backspace" &&
ingredientText.value === "" &&
tags.length > 0
) {

event.preventDefault();

tags.pop();

renderTags();

setTimeout(function() {

ingredientText.focus();

}, 50);

}

}
);


/* ==============================
   TAG AREA CLICK
============================== */

tagInput.addEventListener(
"click",
function(event) {

if (
event.target.tagName === "BUTTON"
) {

const index =
parseInt(
event.target.dataset.index,
10
);


if (!isNaN(index)) {

tags.splice(index, 1);

renderTags();

}


setTimeout(function() {

ingredientText.focus();

}, 50);

}

else {

ingredientText.focus();

}

}
);


/* ==============================
   MARKDOWN CONVERTER
============================== */

function simpleMarkdownToHtml(markdown) {

let html =
escapeHtml(markdown);


html =
html.replace(
/^### (.*)$/gim,
"<h3>$1</h3>"
);


html =
html.replace(
/^## (.*)$/gim,
"<h2>$1</h2>"
);


html =
html.replace(
/^# (.*)$/gim,
"<h1>$1</h1>"
);


html =
html.replace(
/\*\*(.*?)\*\*/g,
"<strong>$1</strong>"
);


html =
html.replace(
/\*(.*?)\*/g,
"<em>$1</em>"
);


html =
html.replace(
/^\d+\.\s(.*)$/gim,
"<li>$1</li>"
);


html =
html.replace(
/^-\s(.*)$/gim,
"<li>$1</li>"
);


html =
html.replace(
/\n/g,
"<br>"
);


return html;

}


/* ==============================
   API REQUEST
============================== */

async function generateRecipe(payload) {

const response =
await fetch(
"/api/generate",
{
method: "POST",

headers: {
"Content-Type":
"application/json"
},

body:
JSON.stringify(payload)

}
);


if (!response.ok) {

throw new Error(
"Server error: " +
response.status
);

}


const data =
await response.json();


if (!data.success) {

throw new Error(
data.recipe ||
"Unable to generate recipe"
);

}


return data.recipe;

}


/* ==============================
   GENERATE RECIPE
============================== */

async function handleGenerate() {


/*
 Remove focus from ingredient input.

This closes mobile keyboard.
*/

ingredientText.blur();


if (!tags.length) {

output.innerHTML = `

<div class="error">

Please add at least one ingredient.

</div>

`;

return;

}


generateBtn.disabled =
true;


generateBtn.textContent =
"Cooking something up...";


followupRow.style.display =
"none";


output.innerHTML = `

<div class="loading">

🍳 PantryChef is cooking up some ideas...

</div>

`;


const payload = {

ingredients:
tags.join(", "),

diet:
dietSelect.value,

followup:
"",

history:
""

};


try {


const recipe =
await generateRecipe(payload);


output.innerHTML = `

<div
class="recipe-card"
id="card"
>

${simpleMarkdownToHtml(recipe)}

</div>

`;


conversationHistory =

"Ingredients: " +
tags.join(", ") +

"\nAssistant: " +
recipe;


followupRow.style.display =
"flex";


setTimeout(function() {

output.scrollIntoView({
behavior: "smooth",
block: "start"
});

}, 100);


}

catch(error) {


console.error(
"Recipe generation error:",
error
);


output.innerHTML = `

<div class="error">

<h2>
Something went wrong
</h2>

<p>
${escapeHtml(error.message)}
</p>

<p>
Please try again.
</p>

</div>

`;

}


generateBtn.disabled =
false;


generateBtn.textContent =
"Find me something to cook";

}


/* ==============================
   FOLLOW-UP
============================== */

async function handleFollowup() {

const question =
followupInput.value.trim();


if (!question) {

return;

}


const card =
document.getElementById("card");


if (!card) {

return;

}


followupBtn.disabled =
true;


followupBtn.textContent =
"Asking...";


const payload = {

ingredients:
tags.join(", "),

diet:
dietSelect.value,

followup:
question,

history:
conversationHistory

};


try {


const answer =
await generateRecipe(payload);


card.innerHTML += `

<hr
style="
margin:24px 0;
border:none;
border-top:
1px solid
rgba(36,49,43,0.15);
"
>

`;


card.innerHTML +=
simpleMarkdownToHtml(answer);


conversationHistory +=

"\nUser: " +
question +

"\nAssistant: " +
answer;


followupInput.value = "";


}

catch(error) {


card.innerHTML += `

<div class="error">

${escapeHtml(error.message)}

</div>

`;

}


followupBtn.disabled =
false;


followupBtn.textContent =
"Ask";

}


/* ==============================
   BUTTON EVENTS
============================== */

generateBtn.addEventListener(
"click",
function(event) {

event.preventDefault();

handleGenerate();

}
);


followupBtn.addEventListener(
"click",
function(event) {

event.preventDefault();

handleFollowup();

}
);


followupInput.addEventListener(
"keydown",
function(event) {

if (event.key === "Enter") {

event.preventDefault();

handleFollowup();

}

}
);

</script>

</body>
</html>
